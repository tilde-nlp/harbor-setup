agent:
  name: terminus-2
  override_timeout_sec: 1200
  kwargs:
    max_turns: 32
    collect_rollout_details: true   # required by SkyRL to extract training data
    temperature: 1.0
    enable_summarize: false
    record_terminal_session: false
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 8192
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
    llm_kwargs:
      timeout: 900
      max_retries: 0
      top_p: 1.0
      top_k: -1
      min_p: 0.0

environment:
  type: singularity
  override_cpus: 1
  override_memory_mb: 4096
  kwargs:
    # Names below must match your installed harbor singularity environment.
    # Check: python -c "import harbor,pathlib;print(pathlib.Path(harbor.__file__).parent)"
    # then read environments/singularity.py for the accepted kwargs.
    image_dir: /local_data/rusevich/llm/skyrl-singularity/sif/tasks
    fakeroot: false                 # setuid fakeroot is unusable when nested
    extra_args:
      - "--userns"
      - "--writable-tmpfs"
      - "--containall"
      - "--bind"
      - "/etc/resolv.conf:/etc/resolv.conf"

verifier:
  disable: false

timeout_multiplier: 1.0