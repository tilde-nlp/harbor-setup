# Test run of the pregenerated stack: grpo_bs5.yaml on 6 nodes, stopped after 10 steps, one HF export at the end.
# Stored, tokenized, scored rollouts are fed to the trainer instead of sampling (skyrl_extensions/pregenerated):
# no vLLM, no weight sync, so every node is a policy node.
# 6 policy nodes (SP=4, DP=12); the reference (frozen start checkpoint) shares the policy GPUs.
# 6 prompts per step, not 5: 6 x 8 rollouts = 48 sequences must split over DP=12 ranks (5 x 8 = 40 does not).
#
#   ./submit.sh [--dry-run] configs/pregen/grpo_test_6n.yaml [key.path=value ...]
#   then: ./check.sh run previous_runs/latest     at step 1 expect run.step1_noise_floor ~0.01-0.02 (policy == reference)
#   export (120 GB fp32, at step 10): exports/pregen_bs6_grpo_test_6n/global_step_10; skip it: skyrl.trainer.hf_save_interval=-1
#
# Self-contained. Meaning of every key and SkyRL's defaults: configs/REFERENCE.yaml.
# SkyRL keys not listed keep the default; [SkyRL default: X] marks a value changed from it.

slurm:
  account: project_465003062
  partition: dev-g
  time: "01:00:00"
  job_name: skyrl-${derived.config_name}
  cpus_per_task: 56
  extra: []

paths:
  root: ${derived.repo_dir}               # this clone, populated by setup.sh
  sandbox: ${paths.root}/multitorch_sandbox.sif
  binds: [/var/spool/slurmd, /scratch/project_465003062, /scratch/project_465002038]
  hf_home: ${paths.root}/hf
  data: ${paths.root}/data
  logs: ${paths.root}/logs
  ckpts: ${paths.root}/ckpts
  exports: ${paths.root}/exports
  runs: ${paths.root}/previous_runs
  experiment: ${derived.config_name}      # names ckpts/ and exports/. One per arm (paths.experiment=retuned), or
                                          # arms overwrite each other's exports and resume from each other's ckpts

model:
  path: ${paths.root}/tildeopen           # must be the checkpoint that generated the rollouts
  max_model_len_cap: 65536

layout:
  gpus_per_node: 8
  policy_nodes: 6
  inference_nodes: 0                      # nothing is generated
  ref_nodes: 0                            # 0: ref on the policy GPUs; > 0: own nodes (placement follows)
  sp: 4
  ray_port: 6379

entrypoint:
  module: skyrl_extensions.pregenerated.entrypoint
  cwd: null

env:
  NCCL_DEBUG: WARN

skyrl:
  data:
    train_data: ["${paths.data}/replay/replay.parquet"]   # prompts and stored rollouts; no val_data

  trainer:
    strategy: fsdp
    logprobs_chunk_size: 512              # [SkyRL default: 1024]
    placement:
      colocate_all: false                 # [SkyRL default: true]
      colocate_policy_ref: ${derived.ref_colocated}
      policy_num_nodes: ${layout.policy_nodes}
      policy_num_gpus_per_node: ${layout.gpus_per_node}
      ref_num_nodes: ${derived.ref_placement_nodes}
      ref_num_gpus_per_node: ${layout.gpus_per_node}
    policy:
      model:
        path: ${derived.model}
      sequence_parallel_size: ${layout.sp}
      fsdp_config:
        fsdp_size: ${derived.policy_gpus}
      optimizer_config:
        lr: 1.0e-6
        adam_betas: [0.9, 0.999]
        num_warmup_steps: 10              # [SkyRL default: 0]
        offload_after_step: false         # [SkyRL default: true] keep optimizer state on GPU
        # retuned arm (+ paths.experiment=retuned) if the band masks most tokens late: lr=3.0e-7 num_warmup_steps=60 adam_betas=[0.9,0.9999]
    ref:
      sequence_parallel_size: ${layout.sp}
    algorithm:
      advantage_estimator: grpo
      grpo_norm_by_std: false             # [SkyRL default: true] Dr. GRPO
      loss_reduction: token_mean
      policy_loss_type: rollout_is        # [SkyRL default: regular] ratio vs the ref worker's log-probs
      eps_clip_low: 0.2                   # band (1 - low, 1 + high)
      eps_clip_high: 0.2
      use_kl_loss: true                   # creates the ref worker; rollout_is needs it
      kl_loss_coef: 0.05                  # [SkyRL default: 0.001]
      kl_estimator_type: k3
      max_seq_len: 65536                  # [SkyRL default: null] >= longest stored prompt + response

    epochs: 1
    max_training_steps: 10                # [SkyRL default: null] test run
    train_batch_size: 6                   # [SkyRL default: 1024] prompts per step (x 8 rollouts); x 8 must divide by DP
    policy_mini_batch_size: 6             # [SkyRL default: 256] one update per batch
    micro_train_batch_size_per_gpu: 1
    micro_forward_batch_size_per_gpu: 1
    max_tokens_per_microbatch: ${skyrl.trainer.algorithm.max_seq_len}
    remove_microbatch_padding: true
    eval_before_train: false              # [SkyRL default: true]
    eval_interval: -1                     # [SkyRL default: 5]
    ckpt_interval: -1                     # [SkyRL default: 10] test run: no checkpoint (~480 GB each)
    hf_save_interval: 10                  # [SkyRL default: -1] one HF export, at the last step
    resume_mode: null                     # [SkyRL default: latest]
    ckpt_path: ${paths.ckpts}/${skyrl.trainer.project_name}_${derived.served_name}_${paths.experiment}
    export_path: ${paths.exports}/${skyrl.trainer.project_name}_${paths.experiment}
    log_path: ${paths.logs}
    logger: console                       # [SkyRL default: wandb]
    project_name: pregen_bs${skyrl.trainer.train_batch_size}
    run_name: ${skyrl.trainer.project_name}_${derived.run_id}

  generator:
    n_samples_per_prompt: 8               # [SkyRL default: 5] = group size in the parquet (asserted)
    apply_overlong_filtering: false       # must stay false (REFERENCE.yaml)
    sampling_params:
      temperature: 1.0                    # same as at generation
