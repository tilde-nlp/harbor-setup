# Harbor on reasoning-gym-easy (288 tasks): agentic multi-turn RL (terminus-2 agent, apptainer
# sandboxes). 2 policy nodes (SP=4, DP=4) + 2 vLLM nodes (TP=4, 4 engines). Step-wise GRPO.
# Two jobs, both started by submit.sh: the Harbor env plane (harbor_env below, launch/harbor_env.sbatch)
# and training, which waits for its bridge and cancels it at the end. Tasks: setup/HARBOR_TASKS.md
#
#   ./submit.sh [--dry-run] configs/harbor/reasoning_gym.yaml [key.path=value ...]
#
# Self-contained. Meaning of every key and SkyRL's defaults: configs/REFERENCE.yaml.
# SkyRL keys not listed keep the default; [SkyRL default: X] marks a value changed from it.

slurm:
  account: project_465003062
  partition: dev-g
  time: "02:00:00"
  job_name: skyrl-${derived.config_name}
  cpus_per_task: 56
  extra: []

paths:
  root: ${derived.repo_dir}               # this clone, populated by setup.sh
  sandbox: ${paths.root}/multitorch_sandbox.sif
  binds: [/var/spool/slurmd, /scratch/project_465003062, /scratch/project_465002038]
  hf_home: ${paths.root}/hf
  data: ${paths.root}/data
  logs: ${paths.root}/logs
  ckpts: ${paths.root}/ckpts
  exports: ${paths.root}/exports
  runs: ${paths.root}/previous_runs

model:
  path: ${paths.root}/tildeopen
  max_model_len_cap: 65536

layout:
  gpus_per_node: 8
  policy_nodes: 2
  inference_nodes: 2
  ref_nodes: 0
  tp: 4
  sp: 4
  ray_port: 6379

entrypoint:
  module: examples.train_integrations.harbor.entrypoints.main_harbor
  cwd: /opt/SkyRL

env: {}

harbor_env:
  submit: true
  bridge_file: ${derived.run_dir}/bridge.url
  slurm: {partition: dev-g, nodes: 1, cpus_per_task: 16, mem: 32G, time: "${slurm.time}"}
  workers_per_node: 8                     # nodes x workers >= generator.rate_limit.max_concurrency
  bridge_port: 9910
  apptainer_dir: ${paths.root}/marin-harbor/src/harbor/environments/apptainer
  sif_cache: ${paths.root}/sif_cache
  singularity_cachedir: ${paths.root}/singularity_cache
  use_fakeroot: 0

skyrl:
  data:
    train_data: ["${paths.root}/tasks/reasoning-gym-easy"]
    val_data: ${skyrl.data.train_data}

  harbor_trial_config:                    # merged over Harbor's defaults (REFERENCE.yaml)
    trials_dir: ${paths.root}/trials
    agent:
      name: terminus-2
      override_timeout_sec: 600           # [Harbor default: 1200] per trial; timed-out trials are masked
      kwargs:
        max_turns: 4                      # [Harbor default: 32]
        record_terminal_session: false
        llm_kwargs:
          max_tokens: ${skyrl.generator.sampling_params.max_generate_length}
          extra_body:
            chat_template_kwargs:
              enable_thinking: true
        model_info:
          max_input_tokens: ${derived.max_input_tokens}
          max_output_tokens: ${skyrl.generator.sampling_params.max_generate_length}
    environment:
      type: apptainer                     # [Harbor default: daytona]
      override_memory_mb: 2048            # [Harbor default: 1024]
      kwargs:
        sif_cache: ${harbor_env.sif_cache}

  trainer:
    strategy: fsdp
    logprobs_chunk_size: 512              # [SkyRL default: 1024]
    placement:
      colocate_all: false                 # [SkyRL default: true] vLLM on its own nodes
      colocate_policy_ref: false          # [SkyRL default: true]
      policy_num_nodes: ${layout.policy_nodes}
      policy_num_gpus_per_node: ${layout.gpus_per_node}
      ref_num_nodes: ${layout.ref_nodes}
      ref_num_gpus_per_node: ${layout.gpus_per_node}
      critic_num_nodes: ${layout.policy_nodes}
      critic_num_gpus_per_node: ${layout.gpus_per_node}
    policy:
      model:
        path: ${derived.model}
      sequence_parallel_size: ${layout.sp}
      fsdp_config:
        fsdp_size: ${derived.policy_gpus}
      optimizer_config:
        lr: 1.0e-6
    ref:
      sequence_parallel_size: ${layout.sp}
    algorithm:
      advantage_estimator: grpo
      loss_reduction: token_mean
      use_kl_loss: false                  # [SkyRL default: true] no reference model
      max_seq_len: ${derived.max_model_len}   # required by the Harbor entrypoint

    epochs: 1
    train_batch_size: 1                   # [SkyRL default: 1024] distinct prompts per step
    policy_mini_batch_size: 1             # [SkyRL default: 256] prompts per optimizer step
    max_tokens_per_microbatch: 65536      # [SkyRL default: -1] token-budget micro batches
    eval_batch_size: 1                    # [SkyRL default: 1024]
    eval_before_train: false              # [SkyRL default: true]
    eval_interval: -1                     # [SkyRL default: 5]
    ckpt_interval: -1                     # [SkyRL default: 10]
    resume_mode: null                     # [SkyRL default: latest]
    ckpt_path: ${paths.ckpts}/${skyrl.trainer.project_name}_${derived.served_name}_ckpt
    export_path: ${paths.exports}/${skyrl.trainer.project_name}
    log_path: ${paths.logs}
    logger: console                       # [SkyRL default: wandb]
    project_name: harbor
    run_name: ${skyrl.trainer.project_name}_lumi_${derived.num_nodes}n_${derived.served_name}_sp${layout.sp}_dp${derived.dp}

  generator:
    inference_engine:
      num_engines: ${derived.num_engines}
      tensor_parallel_size: ${layout.tp}
      distributed_executor_backend: mp    # [SkyRL default: ray] ray may cause errors here
      served_model_name: ${derived.served_name}
      gpu_memory_utilization: 0.85        # [SkyRL default: 0.8]
      max_num_seqs: 4                     # [SkyRL default: 1024]
      max_num_batched_tokens: 16384       # [SkyRL default: 8192]
      engine_init_kwargs:
        max_model_len: ${derived.max_model_len}
        chat_template: /opt/SkyRL/skyrl/train/utils/templates/qwen3_acc_thinking.jinja2
      router_init_kwargs:
        policy: round_robin               # each engine gets a trajectory at the start
    n_samples_per_prompt: 4               # [SkyRL default: 5]
    apply_overlong_filtering: true        # [SkyRL default: false]
    step_wise_trajectories: true          # [SkyRL default: false]
    merge_stepwise_output: true           # [SkyRL default: false]
    rate_limit:
      enabled: true                       # [SkyRL default: false]
      max_concurrency: 4                  # [SkyRL default: null] concurrent trials <= Harbor workers
    sampling_params:
      max_generate_length: 2048           # [SkyRL default: 1024] per LLM call
      temperature: 1.0
