# so_openq ONLINE: on-policy single-step GRPO on the 6,316 prompts of so_openq.online.queries.jsonl (the prompts of
# the offline rollouts in data/replay; here one user message each, no system message, so no tool is offered).
# Reward from the judge "science" (skyrl_extensions/judge/judges.py), 0..10. The judge is the one of the offline
# rollouts (judge_rollouts.py): Qwen3-30B-A3B-Thinking-2507 with --reasoning-parser qwen3, temperature 0.6,
# top_p 0.95, top_k 20, 16,384 tokens for thinking + verdict, 3600 s per request.
# Based on so_openq_judge_bs64.yaml (job 23707393: 6 steps, ~400 s each with an 8k generation cap, Gemma judge).
#
# Different from so_openq_judge_bs64.yaml, and why:
#   data            data/so_openq_online_judge/train.parquet, 6,316 prompts. No validation file: evaluation is off.
#   steps           98 = floor(6,316 / 64): one pass (the last 44 prompts are dropped). Checkpoint + HF export at
#                   25, 50, 75 and at the end (98).
#   generation cap  61,440 tokens (was 8,192): long context is the point. 65,536 - 61,440 = 4,096 left for the
#                   prompt (longest: 518 tokens). A step waits for its longest rollout at ~0.038 s/token: a rollout
#                   that runs to the cap takes ~39 min. Offline: 1.8% of rollouts reach 8k tokens, 0.19% 16k, 0.01% 32k.
#   judge model     Qwen3-30B-A3B-Thinking-2507 (was Gemma 4 31B-it without thinking) and its offline sampling:
#                   see above. Smoke job 23789352: ~2,630 tokens (thinking + verdict) and 92-102 s per request
#                   (Gemma: 2.4 s), 0 unparsed. A verdict that does not fit in 16,384 tokens scores 0
#                   (judge_unparsed; each one is a line of <run dir>/judge_unparsed.jsonl).
#   layout          7 nodes (was 10): 4 policy (SP=4, DP=8) + 2 vLLM (4 engines) + 1 judge (4 servers).
#                   Policy: 2 nodes ran out of GPU memory in the backward pass of step 2 (job 23789352: 56.5 GB
#                   allocated of 64 GB, 8k generation cap; step 1 has lr 0, the optimizer state comes after it).
#                   4 nodes with the reference on them ran 100 steps with sequences up to 47k tokens (job 23683421).
#                   vLLM: the tail of a step runs almost alone, so engines sit idle: 2 nodes (mean rollout time
#                   was the same with 4 engines as with 8). Judge: one node is saturated at ~850 tokens/s per
#                   server, 512 requests take ~8 min. With offline-like lengths the longest rollout of a step
#                   (~12 min) outlasts that; if rollouts rarely run away, judge.nodes=2 shortens the steps.
#   judge context   --max-model-len 131072 (was 32768), judge.max_chars 100,000 (was 60,000). The offline judge saw
#                   the whole response; here a longer one is still cut (head 2/3 + tail 1/3), because a rejected
#                   judge request ends the run: 100,000 characters + 16,384 output tokens fit even at 1 token
#                   per character.
#   lr              1e-5 (was 1e-6), 3 warmup steps: the exports are evaluated in bf16, and a small update does not
#                   survive that cast (lr 3e-6: cosine 0.78 after 100 steps). Watch policy/policy_entropy and
#                   policy/rollout_train_logprobs_abs_diff_mean for drift.
#   KL              use_kl_loss with SkyRL's defaults: loss = policy loss + 0.001 x KL(policy || reference), k3
#                   estimator (policy/policy_kl in the log). The reference is the start checkpoint, frozen, on the
#                   policy GPUs (layout.ref_nodes 0): SkyRL swaps the two models, they are never on the GPUs together
#                   (ran like this on 4 policy nodes: configs/pregen, jobs 23682492, 23683421). A step gains one
#                   reference forward pass over all rollouts. The HF export needs SpillPolicyWorker for this
#                   (skyrl_extensions/judge/entrypoint.py; 77 s in job 23789352). Own reference nodes instead:
#                   layout.ref_nodes=4 (saves ~35 s per step).
#                   Before evaluating: ./check.sh export <export dir>/global_step_N --base tildeopen
#   watchdog        HANG_TIMEOUT_MIN=60 (default 15), passed through sbatch --export in slurm.extra: the log can be
#                   silent for most of a 39-minute generation, and the watchdog would cancel the job as hung.
#   excluded nodes  nid[005018-005021]: hangs in the first forward pass (notes/BUGS.md).
#   time            36 h. Expected ~25 h with offline-like rollout lengths: per step ~12.4 min generation + judging
#                   and ~160 s training (57 s forward passes + 98 s update in job 23683421), plus 16 min start-up
#                   and 4 saves. ~18.5 h if rollouts rarely run away (then the judge sets the pace), ~35 h if the
#                   longest rollout averages 30k tokens: that does not leave room in 36 h (standard-g allows 48 h).
#
# Not changed, to know about: loss_reduction token_mean. One 61k-token rollout is ~10% of a step's tokens, so
# runaway rollouts weigh heavily in the gradient (sequence_mean would weigh every rollout the same).
# NOT RUN YET: 4 policy nodes together with this judge, and the 61,440 cap. Check the first two steps (step 2 is
# the first with the optimizer state on the GPUs) and environment/judge_* before leaving it.
# Not exercised anywhere yet: a single generation request that stays open for ~40 min.
#
#   environment/reward_so_openq       the reward (0..10)
#   environment/judge_answer_correct, judge_bad_reasoning, judge_format_followed   the verdicts
#   environment/judge_skipped         share of rollouts scored 0 unjudged (tool calls, empty); expect ~0
#   environment/judge_unparsed        replies that are not the verdict JSON; expect 0
#
# Data (login node, in the container; 6,316 train rows, no validation rows):
#   python -m skyrl_extensions.judge.dataset science --out data/so_openq_online_judge --val-size 0 \
#       --input so_openq=data/so_openq_online/so_openq.online.queries.jsonl
# Judge model, in hf/ (compute nodes are offline):  Qwen/Qwen3-30B-A3B-Thinking-2507 in judge.model.hf_home
#
#   ./submit.sh [--dry-run] configs/single_step/so_openq_online_lr1e-5.yaml [key.path=value ...]
#   after a time-out or a hang:  ... skyrl.trainer.resume_mode=latest
#
# Self-contained. Meaning of every key and SkyRL's defaults: configs/REFERENCE.yaml.
# SkyRL keys not listed keep the default; [SkyRL default: X] marks a value changed from it.

slurm:
  account: project_465003062
  partition: standard-g
  time: "40:00:00"
  job_name: skyrl-${derived.config_name}
  cpus_per_task: 56
  extra:
    - "--exclude=nid[005018-005021]"        # notes/BUGS.md: hang in the first forward pass
    - "--export=ALL,HANG_TIMEOUT_MIN=60"    # launch/job.sbatch watchdog: a generation to the cap is ~39 min of silence

paths:
  root: ${derived.repo_dir}               # this clone, populated by setup.sh
  sandbox: ${paths.root}/multitorch_sandbox.sif
  binds: [/var/spool/slurmd, /scratch/project_465003062, /scratch/project_465002038]
  hf_home: ${paths.root}/hf
  data: ${paths.root}/data
  logs: ${paths.root}/logs
  ckpts: ${paths.root}/ckpts
  exports: ${paths.root}/exports
  runs: ${paths.root}/previous_runs

model:
  path: ${paths.root}/tildeopen
  max_model_len_cap: 65536

layout:
  gpus_per_node: 8
  policy_nodes: 4                         # 32 GCDs, DP = 32 / sp = 8
  inference_nodes: 2                      # 4 engines
  ref_nodes: 0                            # 0: ref on the policy GPUs; > 0: own nodes (placement follows)
  tp: 4
  sp: 4
  ray_port: 6379

entrypoint:
  module: skyrl_extensions.judge.entrypoint   # main_base + the "judge" env (skyrl_extensions/judge/)
  cwd: null

judge:
  name: science                           # skyrl_extensions/judge/judges.py: prompt, answer schema, reward
  nodes: 1                                # judge nodes, added to the allocation, outside Ray: 4 servers
  base_url: null
  model:
    path: Qwen/Qwen3-30B-A3B-Thinking-2507   # hub id in model.hf_home, or a dir. Served as Qwen3-30B-A3B-Thinking-2507
    hf_home: /scratch/project_465003062/environment/containers/fsdp-skyrl-harbor/hf   # where it was downloaded (rl-rollgen's cache)
  tp: 2                                   # 8 / tp = 4 servers per judge node
  port: 8100
  # the reasoning parser returns the thinking apart from the JSON verdict; the context holds max_chars + max_tokens
  vllm_args: "--max-model-len 131072 --gpu-memory-utilization 0.9 --reasoning-parser qwen3"
  temperature: 0.6                        # judge_rollouts.py: Qwen3 thinking models' recommended sampling
  extra_body: {top_p: 0.95, top_k: 20}    # judge_rollouts.py TOP_P, TOP_K
  max_tokens: 16384                       # judge_rollouts.py MAX_TOKENS: the thinking plus the JSON verdict
  max_chars: 100000                       # longer completions are cut (head + tail) in the judge's prompt
  timeout_s: 3600                         # judge_rollouts.py REQUEST_TIMEOUT
  startup_timeout_s: 1800

env: {}

skyrl:
  data:
    train_data: ["${paths.data}/so_openq_online_judge/train.parquet"]
    # no val_data: with eval_interval -1 SkyRL does not load one

  environment:
    env_class: judge                      # [SkyRL default: gsm8k] for rows without env_class; ours all have one
    skyrl_gym:
      max_env_workers: 128                # [SkyRL default: 32] judge requests in flight (32 per server)

  trainer:
    strategy: fsdp
    logprobs_chunk_size: 512              # [SkyRL default: 1024]
    placement:
      colocate_all: false                 # [SkyRL default: true] vLLM on its own nodes
      colocate_policy_ref: ${derived.ref_colocated}   # = true here (layout.ref_nodes == 0): ref shares the policy GPUs
      policy_num_nodes: ${layout.policy_nodes}
      policy_num_gpus_per_node: ${layout.gpus_per_node}
      ref_num_nodes: ${derived.ref_placement_nodes}
      ref_num_gpus_per_node: ${layout.gpus_per_node}
      critic_num_nodes: ${layout.policy_nodes}
      critic_num_gpus_per_node: ${layout.gpus_per_node}
    policy:
      model:
        path: ${derived.model}
      sequence_parallel_size: ${layout.sp}
      fsdp_config:
        fsdp_size: ${derived.policy_gpus}
      optimizer_config:
        lr: 3.0e-6                        # [SkyRL default: 1.0e-6] the update has to survive the bf16 cast
        num_warmup_steps: 3               # [SkyRL default: 0] linear from 0, then constant
    ref:
      sequence_parallel_size: ${layout.sp}
    algorithm:
      advantage_estimator: grpo
      loss_reduction: token_mean
      use_kl_loss: true                   # loss + kl_loss_coef x KL(policy || ref); creates the ref worker
      kl_loss_coef: 0.001                 # SkyRL default
      kl_estimator_type: k3               # SkyRL default
      max_seq_len: ${derived.max_model_len}

    epochs: 1
    max_prompt_length: 4096               # [SkyRL default: 512] longer prompts are DROPPED at load time; the
                                          # longest prompt here is 1,502 characters (518 tokens)
    max_training_steps: 98                # [SkyRL default: null] floor(6,316 / 64): the whole epoch
    train_batch_size: 64                  # [SkyRL default: 1024] distinct prompts per step (x 8 samples); x 8 must divide by DP
    policy_mini_batch_size: 64            # [SkyRL default: 256] one update per batch
    micro_train_batch_size_per_gpu: 1
    micro_forward_batch_size_per_gpu: 1
    max_tokens_per_microbatch: 65536      # [SkyRL default: -1] token-budget micro batches
    eval_batch_size: 4                    # [SkyRL default: 1024]
    eval_before_train: false              # [SkyRL default: true]
    eval_interval: -1                     # [SkyRL default: 5]
    ckpt_interval: 25                     # [SkyRL default: 10] full FSDP checkpoint, hundreds of GB each; one kept
    max_ckpts_to_keep: 1                  # [SkyRL default: -1]
    hf_save_interval: 25                  # [SkyRL default: -1] HF export at 25, 50, 75 and the end (98)
    resume_mode: null                     # [SkyRL default: latest]
    ckpt_path: ${paths.ckpts}/${skyrl.trainer.project_name}_${derived.served_name}_ckpt
    export_path: ${paths.exports}/${skyrl.trainer.project_name}
    log_path: ${paths.logs}
    logger: console                       # [SkyRL default: wandb]
    project_name: so_openq_online_lr1e-5
    run_name: ${skyrl.trainer.project_name}_lumi_${derived.num_nodes}n_${derived.served_name}_sp${layout.sp}_dp${derived.dp}

  generator:
    inference_engine:
      num_engines: ${derived.num_engines}
      tensor_parallel_size: ${layout.tp}
      distributed_executor_backend: mp    # [SkyRL default: ray] ray may cause errors here
      served_model_name: ${derived.served_name}
      gpu_memory_utilization: 0.8
      engine_init_kwargs:
        max_model_len: ${derived.max_model_len}
    batched: false                        # required: batched=true would judge one completion at a time
    n_samples_per_prompt: 8               # [SkyRL default: 5] as in the offline rollouts
    sampling_params:
      max_generate_length: 61440          # [SkyRL default: 1024] 65,536 - 4,096 for the prompt
      temperature: 1.0
